name: brew test-bot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: python3 -m unittest discover -s tests -v

  test-bot:
    if: github.repository == 'spotter-agent/homebrew-spotter'
    strategy:
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' || github.ref_name != 'main'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: ignore

  package-smoke:
    if: github.repository == 'spotter-agent/homebrew-spotter'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install without mutating Codex and start the stable service
        shell: bash
        run: |
          set -euo pipefail
          codex_home="$(mktemp -d)"
          marker="$codex_home/user-owned"
          printf 'preserve\n' > "$marker"
          before="$(shasum -a 256 "$marker")"
          export CODEX_HOME="$codex_home"

          brew install --build-from-source spotter-agent/spotter/spotter
          [[ "$(shasum -a 256 "$marker")" == "$before" ]]
          [[ "$(find "$codex_home" -type f | wc -l | tr -d ' ')" == "1" ]]
          "$(brew --prefix)/bin/spotter" --version
          "$(brew --prefix)/bin/spotterd" --version

          cleanup() {
            brew services stop spotter-agent/spotter/spotter || true
          }
          trap cleanup EXIT
          brew services start spotter-agent/spotter/spotter
          for _ in {1..20}; do
            if "$(brew --prefix)/bin/spotter" daemon status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$(brew --prefix)/bin/spotter" daemon status
          service_json="$(brew services info spotter-agent/spotter/spotter --json)"
          expected_command="SPOTTER_HOME=\"$HOME/.spotter\" $(brew --prefix)/opt/spotter/bin/spotterd"
          jq -e \
            --arg command "$expected_command" \
            --arg working_dir "$HOME" \
            '.[0].command == $command and .[0].working_dir == $working_dir' \
            <<<"$service_json"

  lifecycle-smoke:
    if: github.repository == 'spotter-agent/homebrew-spotter'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Resolve the matching Spotter source revision
        id: spotter-source
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || 'main' }}
        run: |
          set -euo pipefail
          remote=https://github.com/spotter-agent/spotter.git
          sha="$(git ls-remote "$remote" "refs/heads/$CANDIDATE_REF" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$sha" ]]; then
            sha="$(git ls-remote "$remote" refs/heads/main | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out Spotter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: spotter-agent/spotter
          ref: ${{ steps.spotter-source.outputs.sha }}
          path: spotter-source

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the fixture builder
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/spotter-lifecycle-venv/bin/python"
          python3 -m venv "$RUNNER_TEMP/spotter-lifecycle-venv"
          "$python" -m pip install 'build>=1.2,<2'
          echo "python=$python" >> "$GITHUB_OUTPUT"

      - name: Exercise install, live upgrade, uninstall, and reinstall
        shell: bash
        run: |
          "${{ steps.builder.outputs.python }}" scripts/lifecycle_smoke.py \
            --spotter-source spotter-source \
            --formula-template Formula/spotter.rb
